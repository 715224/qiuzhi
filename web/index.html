<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="求知：每天抽取多个词汇，用一句话解释、生活类比、实际应用和常见误区帮助理解。">
  <meta name="theme-color" content="#36c9c6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="求知">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>求知 · 每日词汇学习</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f2fbfa; }
    .qiuzhi-loading {
      position: fixed; inset: 0; display: grid; place-content: center;
      color: #143c3a; font: 700 16px/1.6 system-ui, sans-serif;
      letter-spacing: 2px; text-align: center;
    }
    .qiuzhi-loading::before {
      content: ''; width: 42px; height: 42px; margin: 0 auto 16px;
      background: #36c9c6; border: 3px solid #143c3a;
      box-shadow: 6px 6px 0 #143c3a;
      animation: qiuzhi-pulse .8s steps(2, end) infinite;
    }
    @keyframes qiuzhi-pulse { 50% { transform: translateY(-6px); } }
  </style>
  <div id="qiuzhi-loading" class="qiuzhi-loading">求知<br><small>正在整理今天的词汇…</small></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
