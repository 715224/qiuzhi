name: qiuzhi
description: 求知 - 每天一个名词，15分钟思考，用自己的话解释它。
publish_to: 'none'
version: 0.3.7+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  http: ^1.2.0
  file_picker: ^10.3.10
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pink_mascot/
    - assets/sounds/
    - daily_hotwords/library.json
    - assets/word_packs/runoob.json
